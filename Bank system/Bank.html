<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesky Union Registration</title>
    <style>
        .collapsible {
            background-color: pink;
            color: peach;
            cursor: blink;
            padding: 5px;
            width: 100%;
            border: dotted;
            text-align: center;
            outline: none;
        }

        .active, .collapsible:hover {
            background-color: powderblue;
        }

        .content {
            padding: 20px;
            display: none;
            overflow: hidden;
            background-color:greenyellow;
        }

        .error {
            color: pink;
            font-size: 12px;
        }
    </style>
</head>
<body>

<h1>Mesky union registration form</h1>

<button type="button" class="collapsible">Personal Details</button>
<div class="content">
    <form id="registrationForm">
        <label for="Username">UserName:</label><br>
        <input type="text" id="username" name="username"><br>
        <span class="error" id="usernameError"></span><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <span class="error" id="emailError"></span><br>

        <p>Select gender</p>
        <label for="Male">Male</label>
        <input type="radio" value="Male" name="gender" id="Male"><br/>

        <label for="Female">Female</label>

</div>

        <span class="error" id="saveError"></span><br>

        <button type="button" onclick="validateForm()">Submit</button>
    </form>
</div>

<script>

    for (var i = 0; i < coll.length; i++) {
        coll[i].addEventListener("click", function() {
            this.classList.toggle("active");
            var content = this.nextElementSibling;
            if (content.style.display === "block") {
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }
        });
    }

    function validateForm() {

</body>
</html>
